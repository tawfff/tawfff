<!doctype html>
<html><head><meta charset="utf-8">
<!-- One project card. Design system: open-design "x-ai". Params: ?img=&label=&title=&line=&fit=cover|contain&pos=top -->
<style>
:root { --bg: #1f2228; --line: #2c3038; --fg: #ffffff; --muted: #8b8f97; --dim: #6b7079;
  --mono: "Geist Mono", "SF Mono", ui-monospace, Menlo, monospace; --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 800px; height: 640px; background: transparent; }
.card { width: 800px; height: 640px; border-radius: 22px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
.shot { height: 440px; background: #15171b center top / cover no-repeat; border-bottom: 1px solid var(--line); }
.shot.contain { background-size: contain; background-position: center; }
.text { padding: 30px 36px; }
.label { font: 500 15px var(--mono); letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 14px; }
.title { font: 400 38px var(--mono); letter-spacing: -1px; color: var(--fg); margin-bottom: 10px; }
.line { font: 400 21px/1.35 var(--sans); color: var(--muted); }
.receipts { flex: 1; padding: 44px 40px; display: flex; flex-direction: column; }
.names { margin-top: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
.names div { font: 400 26px var(--mono); color: var(--fg); letter-spacing: -0.5px; border-top: 1px solid var(--line); padding-top: 12px; }
.names span { display: block; font: 400 15px var(--mono); letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-top: 6px; }
</style></head>
<body><div class="card" id="c"></div>
<script>
const q = new URLSearchParams(location.search), c = document.getElementById('c');
if (q.get('kind') === 'receipts') {
  c.innerHTML = `<div class="receipts"><div class="label">Track record</div><div class="title">Worked with</div>
    <div class="names">${JSON.parse(q.get('names')).map(([n, r]) => `<div>${n}<span>${r}</span></div>`).join('')}</div></div>`;
} else {
  c.innerHTML = `<div class="shot ${q.get('fit') === 'contain' ? 'contain' : ''}" style="background-image:url('${q.get('img')}')${q.get('bg') ? ';background-color:' + q.get('bg') : ''}"></div>
    <div class="text"><div class="label">${q.get('label')}</div><div class="title">${q.get('title')}</div><div class="line">${q.get('line')}</div></div>`;
}
</script></body></html>
